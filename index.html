<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Job Calendar">
  <meta name="theme-color" content="#F2F2F7">
  <meta name="description" content="Monthly job schedule, colour-coded by company">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>Job Calendar</title>
  <style>
    :root {
      --header-h: 52px;
      --dow-h: 28px;
      --legend-h: 48px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --today-red: #FF3B30;
      --line: #E5E5EA;
      --text: #1C1C1E;
      --muted: #8E8E93;
      --bg: #F2F2F7;
      --card: #FFFFFF;
      --accent: #E67E22;
      --blue: #007AFF;
      --date-h: 24px;
      --bar-h: 16px;
      --bar-gap: 2px;
      --overflow-h: 14px;
      --week-h: 110px;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", "Noto Sans SC", "Helvetica Neue", sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }
    button, input, textarea, select { font-family: inherit; }
    button {
      appearance: none;
      border: 0;
      background: none;
      color: inherit;
      padding: 0;
      margin: 0;
      cursor: pointer;
    }
    input, textarea { user-select: text; -webkit-user-select: text; font-size: 16px; }

    #app {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding-top: var(--safe-top);
      padding-bottom: 0;
      background: var(--bg);
    }

    header.app-header {
      height: var(--header-h);
      flex: 0 0 var(--header-h);
      display: flex;
      align-items: center;
      padding: 0 8px 0 4px;
      gap: 4px;
      background: var(--bg);
    }
    .icon-btn {
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--blue);
      border-radius: 10px;
      flex: 0 0 40px;
    }
    .icon-btn:active { background: rgba(0,0,0,.06); }
    .icon-btn svg { width: 22px; height: 22px; }
    .nav-title {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
      min-width: 0;
    }
    .nav-title h1 {
      margin: 0;
      font-size: 17px;
      font-weight: 650;
      letter-spacing: -0.02em;
      white-space: nowrap;
    }
    .nav-title .chevron {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--blue);
      font-size: 28px;
      font-weight: 300;
      line-height: 1;
      border-radius: 8px;
    }
    .nav-title .chevron:active { background: rgba(0,0,0,.06); }
    #btn-today {
      flex: 0 0 auto;
      height: 32px;
      padding: 0 12px;
      border-radius: 16px;
      background: #fff;
      color: var(--today-red);
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 0 0 1px rgba(0,0,0,.06);
    }
    #btn-today:active { background: #f2f2f2; }
    #btn-today.hidden { visibility: hidden; pointer-events: none; }

    .dow {
      flex: 0 0 var(--dow-h);
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      align-items: center;
      background: var(--bg);
      padding: 0 0 2px;
      position: relative;
      z-index: 3;
    }
    .dow span {
      text-align: center;
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 0.02em;
    }
    .dow span.sun { color: #E05A5A; }

    #calendar {
      flex: 1;
      display: block;
      position: relative;
      min-height: 0;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overflow-anchor: none;
      overscroll-behavior: contain;
      background: #fff;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      touch-action: pan-y;
      scrollbar-width: none;
    }
    #calendar::-webkit-scrollbar { display: none; }
    .week {
      flex: none;
      height: var(--week-h);
      position: relative;
      display: flex;
      border-bottom: 1px solid var(--line);
    }
    .week-days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      width: 100%;
      height: 100%;
    }
    .day-cell {
      border-right: 1px solid var(--line);
      position: relative;
      min-width: 0;
      overflow: hidden;
    }
    .day-cell:last-child { border-right: 0; }
    .day-cell.outside { background: #FAFAFA; }
    .day-cell.selected { background: #F0F4FF; }
    .day-cell.outside.selected { background: #F3F5FA; }
    .day-num {
      width: 22px;
      height: 22px;
      margin: 3px auto 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 600;
      border-radius: 50%;
      line-height: 1;
    }
    .day-num.today {
      background: var(--today-red);
      color: #fff !important;
      font-weight: 700;
    }
    .day-num.outside { color: #C7C7CC; font-weight: 500; }
    .day-num.sunday:not(.today):not(.outside) { color: #E05A5A; }
    .day-num.month-start {
      width: auto;
      min-width: 22px;
      padding: 0 5px;
      border-radius: 11px;
      font-size: 11px;
      letter-spacing: -0.04em;
      white-space: nowrap;
    }
    .day-overflow {
      position: absolute;
      bottom: 1px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 10px;
      font-weight: 600;
      color: var(--muted);
      line-height: var(--overflow-h);
      pointer-events: none;
    }
    .week-events {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .event-bar {
      position: absolute;
      height: var(--bar-h);
      padding: 0 3px;
      font-size: 10px;
      font-weight: 650;
      line-height: var(--bar-h);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      pointer-events: auto;
      letter-spacing: -0.04em;
    }
    .event-bar:active { filter: brightness(0.92); }

    #legend {
      flex: 0 0 auto;
      min-height: var(--legend-h);
      padding: 8px 72px 8px 10px;
      padding-bottom: calc(10px + max(var(--safe-bottom), 20px));
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      background: var(--bg);
      scrollbar-width: none;
    }
    #legend::-webkit-scrollbar { display: none; }
    .legend-chip {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 6px;
      height: 30px;
      padding: 0 10px 0 8px;
      border-radius: 15px;
      background: #fff;
      font-size: 12px;
      font-weight: 600;
      box-shadow: 0 0 0 1px rgba(0,0,0,.06);
      color: var(--text);
      white-space: nowrap;
    }
    .legend-chip:active { background: #f2f2f2; }
    .legend-chip.off {
      color: var(--muted);
      background: transparent;
      box-shadow: 0 0 0 1px var(--line);
    }
    .legend-chip.off .dot { opacity: 0.35; }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex: 0 0 10px;
    }

    #fab {
      position: fixed;
      right: 16px;
      bottom: calc(var(--legend-h) + max(var(--safe-bottom), 20px) + 8px);
      width: 56px;
      height: 56px;
      border-radius: 28px;
      background: var(--accent);
      color: #fff;
      font-size: 32px;
      font-weight: 300;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 16px rgba(230, 126, 34, 0.45);
      z-index: 20;
    }
    #fab:active { transform: scale(0.96); filter: brightness(0.95); }

    #toast {
      position: fixed;
      left: 50%;
      bottom: calc(90px + var(--safe-bottom));
      transform: translateX(-50%) translateY(12px);
      max-width: calc(100% - 40px);
      background: rgba(28,28,30,.92);
      color: #fff;
      font-size: 13px;
      line-height: 1.45;
      padding: 10px 14px;
      border-radius: 12px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s, transform .25s;
      z-index: 80;
      text-align: center;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    #install-tip {
      display: none;
      flex: 0 0 auto;
      margin: 0 12px 8px;
      padding: 10px 12px;
      background: #fff;
      border-radius: 12px;
      font-size: 12px;
      color: #3A3A3C;
      line-height: 1.45;
      box-shadow: 0 0 0 1px rgba(0,0,0,.05);
      position: relative;
    }
    #install-tip.show { display: block; }
    #install-tip b { color: var(--text); }
    #install-tip .close-tip {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 28px;
      height: 28px;
      color: var(--muted);
      font-size: 18px;
    }

    .backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.4);
      z-index: 40;
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s;
    }
    .backdrop.show { opacity: 1; pointer-events: auto; }

    .sheet {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      max-height: 92dvh;
      background: var(--bg);
      border-radius: 16px 16px 0 0;
      z-index: 50;
      transform: translateY(110%);
      transition: transform .32s cubic-bezier(.2,.8,.2,1);
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      padding-bottom: calc(20px + var(--safe-bottom));
    }
    .sheet.show { transform: translateY(0); }
    .sheet-handle {
      width: 36px;
      height: 5px;
      border-radius: 3px;
      background: #D1D1D6;
      margin: 8px auto 4px;
    }
    .sheet-head {
      display: flex;
      align-items: center;
      padding: 4px 16px 12px;
      position: sticky;
      top: 0;
      background: var(--bg);
      z-index: 2;
    }
    .sheet-head h2 {
      flex: 1;
      margin: 0;
      font-size: 17px;
      font-weight: 700;
      text-align: center;
    }
    .sheet-head .side {
      min-width: 56px;
      font-size: 16px;
      color: var(--blue);
      font-weight: 500;
    }
    .sheet-head .side.right { text-align: right; }
    .sheet-head .side.danger { color: var(--today-red); }
    .sheet-head .side:disabled { color: var(--muted); }

    .group {
      background: #fff;
      margin: 0 16px 16px;
      border-radius: 12px;
      overflow: hidden;
    }
    .row {
      display: flex;
      align-items: center;
      min-height: 48px;
      padding: 8px 16px;
      gap: 12px;
      border-bottom: 1px solid var(--line);
    }
    .row:last-child { border-bottom: 0; }
    .row .label {
      flex: 0 0 78px;
      font-size: 15px;
      color: var(--text);
    }
    .row input[type="text"],
    .row input[type="date"],
    .row textarea {
      flex: 1;
      border: 0;
      outline: none;
      background: transparent;
      min-width: 0;
      color: var(--text);
    }
    .row textarea {
      min-height: 72px;
      resize: vertical;
      padding: 8px 0;
      line-height: 1.4;
    }
    .row-btn {
      width: 100%;
      text-align: left;
      display: flex;
      align-items: center;
      min-height: 48px;
      padding: 8px 16px;
      gap: 12px;
      font-size: 16px;
    }
    .row-btn:active { background: #f2f2f7; }
    .row-btn .chev { margin-left: auto; color: #C7C7CC; font-size: 18px; }
    .row-btn .sub { margin-left: auto; color: var(--muted); font-size: 15px; }
    .link-btn {
      display: block;
      width: calc(100% - 32px);
      margin: 0 16px 12px;
      min-height: 48px;
      border-radius: 12px;
      background: #fff;
      font-size: 16px;
      font-weight: 600;
    }
    .link-btn:active { background: #f2f2f7; }
    .link-btn.danger { color: var(--today-red); }
    .group .row-btn + .row-btn,
    .group .company-item + .company-item,
    .group .event-item + .event-item,
    .group .filter-row + .filter-row { border-top: 1px solid var(--line); }

    .event-item {
      display: flex;
      align-items: stretch;
      width: 100%;
      text-align: left;
      min-height: 56px;
      background: #fff;
    }
    .event-item:active { background: #f2f2f7; }
    .event-item .stripe {
      width: 6px;
      flex: 0 0 6px;
    }
    .event-item .body {
      flex: 1;
      padding: 10px 16px;
      min-width: 0;
    }
    .event-item .title {
      font-size: 16px;
      font-weight: 650;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .event-item .meta {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }
    .empty {
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      padding: 28px 16px;
    }

    .company-item {
      display: flex;
      align-items: center;
      width: 100%;
      text-align: left;
      min-height: 52px;
      padding: 8px 16px;
      gap: 12px;
      background: #fff;
    }
    .company-item:active { background: #f2f2f7; }
    .company-item .name { flex: 1; font-size: 16px; font-weight: 600; }
    .company-item .chev { color: #C7C7CC; }

    .color-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      padding: 14px 16px;
    }
    .color-swatch {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,.08);
      position: relative;
    }
    .color-swatch.selected::after {
      content: "";
      position: absolute;
      inset: 4px;
      border-radius: 50%;
      border: 2px solid #fff;
    }
    .color-custom {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      overflow: hidden;
      position: relative;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,.08);
      background: conic-gradient(red, yellow, lime, aqua, blue, magenta, red);
    }
    .color-custom input {
      position: absolute;
      inset: 0;
      opacity: 0;
      width: 100%;
      height: 100%;
      cursor: pointer;
    }

    .hint {
      margin: 0 20px 16px;
      font-size: 13px;
      color: var(--muted);
      line-height: 1.5;
    }

    .confirm {
      position: fixed;
      left: 24px;
      right: 24px;
      top: 50%;
      transform: translateY(-50%) scale(.96);
      background: #fff;
      border-radius: 14px;
      z-index: 70;
      padding: 22px 20px 16px;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s, transform .2s;
    }
    .confirm.show { opacity: 1; transform: translateY(-50%) scale(1); pointer-events: auto; }
    .confirm h3 { margin: 0 0 8px; font-size: 17px; }
    .confirm p { margin: 0 0 16px; font-size: 14px; color: #3A3A3C; line-height: 1.45; }
    .confirm .actions { display: flex; gap: 10px; }
    .confirm .actions button {
      flex: 1;
      height: 44px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      background: var(--bg);
    }
    .confirm .actions button.primary { background: var(--blue); color: #fff; }
    .confirm .actions button.danger { background: var(--today-red); color: #fff; }

    .filter-row {
      display: flex;
      align-items: center;
      padding: 10px 16px;
      gap: 12px;
      background: #fff;
    }
    .filter-row .name { flex: 1; font-size: 16px; }
    .toggle {
      width: 51px;
      height: 31px;
      border-radius: 16px;
      background: #E9E9EB;
      position: relative;
      transition: background .2s;
      flex: 0 0 51px;
    }
    .toggle.on { background: #34C759; }
    .toggle::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 27px;
      height: 27px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 1px 3px rgba(0,0,0,.25);
      transition: transform .2s;
    }
    .toggle.on::after { transform: translateX(20px); }
  </style>
</head>
<body>
  <div id="app">
    <header class="app-header">
      <button class="icon-btn" id="btn-menu" aria-label="Menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="6" r="1.2" fill="currentColor" stroke="none"/>
          <circle cx="12" cy="12" r="1.2" fill="currentColor" stroke="none"/>
          <circle cx="12" cy="18" r="1.2" fill="currentColor" stroke="none"/>
        </svg>
      </button>
      <div class="nav-title">
        <button class="chevron" id="btn-prev" aria-label="Previous month">‹</button>
        <h1 id="month-label">November 2026</h1>
        <button class="chevron" id="btn-next" aria-label="Next month">›</button>
      </div>
      <button id="btn-today" type="button">Today</button>
    </header>
    <div class="dow" id="dow"></div>
    <div id="calendar" aria-label="Calendar"></div>
    <div id="install-tip">
      <button class="close-tip" id="btn-close-tip" aria-label="Close">×</button>
      In Safari, tap the Share button and choose <b>Add to Home Screen</b> to use it like an app. Data is stored on this device.
    </div>
    <div id="legend"></div>
  </div>
  <button id="fab" aria-label="Add job">+</button>
  <div class="backdrop" id="backdrop"></div>
  <div class="sheet" id="sheet"></div>
  <div class="backdrop" id="confirm-backdrop"></div>
  <div class="confirm" id="confirm"></div>
  <div id="toast"></div>
  <input type="file" id="import-file" accept="application/json,.json" hidden>
  <input type="file" id="ikea-import-file" accept="application/json,.json" hidden>

  <script>
  (function () {
    "use strict";

    const STORAGE_KEY = "gongli-v1";
    const TIP_KEY = "gongli-tip-dismissed";
    const WEEKDAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
    const WEEKDAYS_FULL = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
    const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
    const MONTHS_SHORT = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    const PRESET_COLORS = [
      "#E67E22", "#2F80ED", "#27AE60", "#E84393", "#9B59B6",
      "#E74C3C", "#16A085", "#D35400", "#2980B9", "#8E44AD",
      "#F1C40F", "#2C3E50", "#1ABC9C", "#C0392B", "#7F8C8D"
    ];
    const DEFAULT_COMPANIES = [
      { id: "c-ikea", name: "IKEA", color: "#E67E22" },
      { id: "c-blue", name: "Blue Co.", color: "#2F80ED" },
      { id: "c-green", name: "Green Co.", color: "#27AE60" },
      { id: "c-pink", name: "Pink Co.", color: "#E84393" },
      { id: "c-purple", name: "Purple Co.", color: "#9B59B6" }
    ];

    const el = {
      calendar: document.getElementById("calendar"),
      legend: document.getElementById("legend"),
      monthLabel: document.getElementById("month-label"),
      btnToday: document.getElementById("btn-today"),
      dow: document.getElementById("dow"),
      sheet: document.getElementById("sheet"),
      backdrop: document.getElementById("backdrop"),
      toast: document.getElementById("toast"),
      installTip: document.getElementById("install-tip"),
      importFile: document.getElementById("import-file"),
      ikeaImportFile: document.getElementById("ikea-import-file"),
      confirm: document.getElementById("confirm"),
      confirmBackdrop: document.getElementById("confirm-backdrop"),
      fab: document.getElementById("fab")
    };

    let data = loadData();
    let viewYear, viewMonth; // titled month, 0-based
    let selectedDate = null; // YYYY-MM-DD
    let sheetOpen = false;
    let confirmCb = null;
    let toastTimer = null;
    let rangeStart = null; // Sunday ISO of first rendered week
    let rangeEnd = null;   // Sunday ISO of last rendered week
    let extending = false;
    let titleRaf = 0;
    const INITIAL_MONTHS = 12;
    const EXTEND_MONTHS = 6;
    const EXTEND_WEEKS_THRESHOLD = 8;

    const now = new Date();
    viewYear = now.getFullYear();
    viewMonth = now.getMonth();

    /* ------------ storage ------------ */
    function loadData() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) {
          return {
            companies: DEFAULT_COMPANIES.map((c) => Object.assign({}, c)),
            events: [],
            hiddenCompanyIds: []
          };
        }
        const parsed = JSON.parse(raw);
        const companies = Array.isArray(parsed.companies) ? parsed.companies.filter(validCompany) : [];
        return {
          companies: companies.length ? companies : DEFAULT_COMPANIES.map((c) => Object.assign({}, c)),
          events: Array.isArray(parsed.events) ? parsed.events.filter(validEvent) : [],
          hiddenCompanyIds: Array.isArray(parsed.hiddenCompanyIds) ? parsed.hiddenCompanyIds : []
        };
      } catch (err) {
        return {
          companies: DEFAULT_COMPANIES.map((c) => Object.assign({}, c)),
          events: [],
          hiddenCompanyIds: []
        };
      }
    }
    function validCompany(c) {
      return c && typeof c.id === "string" && typeof c.name === "string" && typeof c.color === "string";
    }
    function validEvent(e) {
      return e && typeof e.id === "string" && typeof e.title === "string" &&
        typeof e.companyId === "string" && isISODate(e.start) && isISODate(e.end);
    }
    function saveData() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }
    function uid(prefix) {
      return prefix + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    }

    /* ------------ dates ------------ */
    function isISODate(s) {
      return typeof s === "string" && /^\d{4}-\d{2}-\d{2}$/.test(s);
    }
    function toISODate(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return y + "-" + m + "-" + day;
    }
    function parseISODate(s) {
      const p = s.split("-").map(Number);
      return new Date(p[0], p[1] - 1, p[2]);
    }
    function addDaysISO(s, n) {
      const d = parseISODate(s);
      d.setDate(d.getDate() + n);
      return toISODate(d);
    }
    function daysBetween(a, b) {
      return Math.round((parseISODate(b) - parseISODate(a)) / 86400000);
    }
    function todayISO() {
      return toISODate(new Date());
    }
    function isSameMonth(iso, y, m) {
      const d = parseISODate(iso);
      return d.getFullYear() === y && d.getMonth() === m;
    }
    function formatLong(iso) {
      const d = parseISODate(iso);
      return WEEKDAYS_FULL[d.getDay()] + ", " + MONTHS[d.getMonth()] + " " + d.getDate() + ", " + d.getFullYear();
    }
    function formatShort(iso) {
      const d = parseISODate(iso);
      return MONTHS_SHORT[d.getMonth()] + " " + d.getDate();
    }
    function startOfWeekDate(d) {
      const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
      x.setDate(x.getDate() - x.getDay());
      return x;
    }
    function weekStartISO(d) {
      return toISODate(startOfWeekDate(d instanceof Date ? d : parseISODate(d)));
    }
    function addWeeksISO(sundayISO, n) {
      return addDaysISO(sundayISO, n * 7);
    }
    function weeksBetween(a, b) {
      return Math.round(daysBetween(a, b) / 7);
    }
    function getWeekHeight() {
      const w = el.calendar.querySelector(".week");
      if (w && w.offsetHeight) return w.offsetHeight;
      const raw = getComputedStyle(document.documentElement).getPropertyValue("--week-h");
      const n = parseFloat(raw);
      return n > 0 ? n : 110;
    }

    /* ------------ helpers ------------ */
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c];
      });
    }
    function companyById(id) {
      for (let i = 0; i < data.companies.length; i++) {
        if (data.companies[i].id === id) return data.companies[i];
      }
      return null;
    }
    function textColor(bg) {
      let hex = String(bg || "").replace("#", "");
      if (hex.length === 3) hex = hex.split("").map(function (c) { return c + c; }).join("");
      if (hex.length !== 6) return "#fff";
      const r = parseInt(hex.slice(0, 2), 16);
      const g = parseInt(hex.slice(2, 4), 16);
      const b = parseInt(hex.slice(4, 6), 16);
      const yiq = (r * 299 + g * 587 + b * 114) / 1000;
      return yiq > 165 ? "#1C1C1E" : "#FFFFFF";
    }
    function visibleEvents() {
      const hidden = {};
      data.hiddenCompanyIds.forEach(function (id) { hidden[id] = true; });
      return data.events.filter(function (e) { return !hidden[e.companyId]; });
    }

    /* ------------ render ------------ */
    function render() {
      renderLegend();
      if (!el.calendar.querySelector(".week")) {
        initCalendar();
      } else {
        layoutEventBars();
        updateSelected();
        updateMonthTitle();
      }
    }

    function initRangeAround(date) {
      const from = new Date(date.getFullYear(), date.getMonth() - INITIAL_MONTHS, 1);
      const to = new Date(date.getFullYear(), date.getMonth() + INITIAL_MONTHS + 1, 0);
      rangeStart = weekStartISO(from);
      rangeEnd = weekStartISO(to);
    }

    function weekHTML(sundayISO) {
      const today = todayISO();
      let html = '<div class="week" data-week-start="' + sundayISO + '">';
      html += '<div class="week-days">';
      for (let i = 0; i < 7; i++) {
        const d = parseISODate(addDaysISO(sundayISO, i));
        const iso = toISODate(d);
        const outside = d.getFullYear() !== viewYear || d.getMonth() !== viewMonth;
        const isFirst = d.getDate() === 1;
        const cls = ["day-cell"];
        if (outside) cls.push("outside");
        if (selectedDate === iso) cls.push("selected");
        const numCls = ["day-num"];
        if (iso === today) numCls.push("today");
        if (outside) numCls.push("outside");
        if (d.getDay() === 0) numCls.push("sunday");
        if (isFirst) numCls.push("month-start");
        const label = isFirst ? MONTHS_SHORT[d.getMonth()] + " " + d.getDate() : String(d.getDate());
        html += '<div class="' + cls.join(" ") + '" data-date="' + iso + '">';
        html += '<div class="' + numCls.join(" ") + '">' + label + "</div>";
        html += '<div class="day-overflow" data-overflow="' + iso + '"></div>';
        html += "</div>";
      }
      html += "</div>";
      html += '<div class="week-events"></div>';
      html += "</div>";
      return html;
    }

    function paintRange() {
      let html = "";
      for (let w = rangeStart; w <= rangeEnd; w = addWeeksISO(w, 1)) {
        html += weekHTML(w);
      }
      el.calendar.innerHTML = html;
      layoutEventBars();
    }

    function initCalendar() {
      const t = new Date();
      viewYear = t.getFullYear();
      viewMonth = t.getMonth();
      el.monthLabel.textContent = MONTHS[viewMonth] + " " + viewYear;
      initRangeAround(t);
      paintRange();
      function place() {
        scrollToWeek(weekStartISO(t), false);
        updateMonthTitle();
      }
      place();
      requestAnimationFrame(place);
    }

    function weekEl(sundayISO) {
      return el.calendar.querySelector('.week[data-week-start="' + sundayISO + '"]');
    }

    function ensureWeekInRange(sundayISO) {
      if (rangeStart && sundayISO >= rangeStart && sundayISO <= rangeEnd) return;
      if (!rangeStart) {
        initRangeAround(parseISODate(sundayISO));
        paintRange();
        return;
      }
      if (sundayISO < rangeStart) {
        const from = new Date(parseISODate(sundayISO).getFullYear(), parseISODate(sundayISO).getMonth() - EXTEND_MONTHS, 1);
        prependWeeks(weekStartISO(from));
      } else if (sundayISO > rangeEnd) {
        const to = new Date(parseISODate(sundayISO).getFullYear(), parseISODate(sundayISO).getMonth() + EXTEND_MONTHS + 1, 0);
        appendWeeks(weekStartISO(to));
      }
    }

    function prependWeeks(newStart) {
      if (!newStart || newStart >= rangeStart) return;
      const weeks = [];
      for (let w = newStart; w < rangeStart; w = addWeeksISO(w, 1)) weeks.push(w);
      if (!weeks.length) return;
      extending = true;
      const tmp = document.createElement("div");
      tmp.innerHTML = weeks.map(weekHTML).join("");
      const frag = document.createDocumentFragment();
      while (tmp.firstChild) frag.appendChild(tmp.firstChild);
      const weekH = getWeekHeight();
      const prevTop = el.calendar.scrollTop;
      el.calendar.insertBefore(frag, el.calendar.firstChild);
      rangeStart = newStart;
      void el.calendar.offsetHeight;
      el.calendar.scrollTop = prevTop + weeks.length * weekH;
      layoutEventBars();
      extending = false;
    }

    function appendWeeks(newEnd) {
      if (!newEnd || newEnd <= rangeEnd) return;
      const weeks = [];
      for (let w = addWeeksISO(rangeEnd, 1); w <= newEnd; w = addWeeksISO(w, 1)) weeks.push(w);
      if (!weeks.length) return;
      extending = true;
      const tmp = document.createElement("div");
      tmp.innerHTML = weeks.map(weekHTML).join("");
      const frag = document.createDocumentFragment();
      while (tmp.firstChild) frag.appendChild(tmp.firstChild);
      el.calendar.appendChild(frag);
      rangeEnd = newEnd;
      layoutEventBars();
      extending = false;
    }

    function maybeExtendRange() {
      if (extending || !rangeStart) return;
      const weekH = getWeekHeight();
      if (!weekH) return;
      const fromTop = el.calendar.scrollTop / weekH;
      const fromBottom = (el.calendar.scrollHeight - el.calendar.scrollTop - el.calendar.clientHeight) / weekH;
      if (fromTop < EXTEND_WEEKS_THRESHOLD) {
        const edge = parseISODate(rangeStart);
        prependWeeks(weekStartISO(new Date(edge.getFullYear(), edge.getMonth() - EXTEND_MONTHS, 1)));
      }
      if (fromBottom < EXTEND_WEEKS_THRESHOLD) {
        const edge = parseISODate(rangeEnd);
        appendWeeks(weekStartISO(new Date(edge.getFullYear(), edge.getMonth() + EXTEND_MONTHS + 1, 0)));
      }
    }

    function scrollToWeek(sundayISO, smooth) {
      ensureWeekInRange(sundayISO);
      const node = weekEl(sundayISO);
      if (!node) return;
      const top = el.calendar.scrollTop + (node.getBoundingClientRect().top - el.calendar.getBoundingClientRect().top);
      if (smooth && typeof el.calendar.scrollTo === "function") {
        el.calendar.scrollTo({ top: Math.max(0, top), behavior: "smooth" });
      } else {
        el.calendar.scrollTop = Math.max(0, top);
        updateMonthTitle();
      }
    }

    function updateSelected() {
      el.calendar.querySelectorAll(".day-cell.selected").forEach(function (c) {
        c.classList.remove("selected");
      });
      if (!selectedDate) return;
      const cell = el.calendar.querySelector('.day-cell[data-date="' + selectedDate + '"]');
      if (cell) cell.classList.add("selected");
    }

    function updateOutsideClasses() {
      el.calendar.querySelectorAll(".day-cell").forEach(function (cell) {
        const d = parseISODate(cell.getAttribute("data-date"));
        const outside = d.getFullYear() !== viewYear || d.getMonth() !== viewMonth;
        cell.classList.toggle("outside", outside);
        const num = cell.querySelector(".day-num");
        if (num) num.classList.toggle("outside", outside);
      });
    }

    function monthKeyFromISO(iso) {
      return iso.slice(0, 7);
    }
    function titledMonthFromWeek(weekNode) {
      const cells = weekNode.querySelectorAll(".day-cell");
      if (!cells.length) return null;
      let firstOfMonth = null;
      const counts = {};
      for (let i = 0; i < cells.length; i++) {
        const iso = cells[i].getAttribute("data-date");
        const key = monthKeyFromISO(iso);
        counts[key] = (counts[key] || 0) + 1;
        if (iso.slice(-2) === "01") firstOfMonth = key;
      }
      if (firstOfMonth) return firstOfMonth;
      let best = null, bestCount = -1;
      Object.keys(counts).forEach(function (key) {
        if (counts[key] > bestCount) { bestCount = counts[key]; best = key; }
      });
      return best;
    }
    function updateMonthTitle() {
      const calRect = el.calendar.getBoundingClientRect();
      if (calRect.height <= 0) return;
      const weekH = getWeekHeight();
      const probeY = calRect.top + Math.min(weekH * 0.35, Math.max(8, calRect.height * 0.15));
      const weeks = el.calendar.querySelectorAll(".week");
      let probeWeek = null;
      for (let i = 0; i < weeks.length; i++) {
        const r = weeks[i].getBoundingClientRect();
        if (r.bottom > probeY && r.top <= probeY) { probeWeek = weeks[i]; break; }
      }
      if (!probeWeek) {
        for (let i = 0; i < weeks.length; i++) {
          const r = weeks[i].getBoundingClientRect();
          if (r.bottom > calRect.top && r.top < calRect.bottom) { probeWeek = weeks[i]; break; }
        }
      }
      const best = probeWeek ? titledMonthFromWeek(probeWeek) : null;
      if (!best) return;
      const y = parseInt(best.slice(0, 4), 10);
      const m = parseInt(best.slice(5, 7), 10) - 1;
      if (y !== viewYear || m !== viewMonth) {
        viewYear = y;
        viewMonth = m;
        el.monthLabel.textContent = MONTHS[m] + " " + y;
        updateOutsideClasses();
      } else if (!el.monthLabel.textContent) {
        el.monthLabel.textContent = MONTHS[m] + " " + y;
      }
      const todayWeek = weekEl(weekStartISO(new Date()));
      let hideToday = false;
      if (todayWeek) {
        const r = todayWeek.getBoundingClientRect();
        const dist = r.top - calRect.top;
        hideToday = dist >= -8 && dist < 24;
      }
      el.btnToday.classList.toggle("hidden", hideToday);
    }

    function layoutEventBars() {
      const weeks = el.calendar.querySelectorAll(".week");
      if (!weeks.length) return;
      const rowH = weeks[0].clientHeight;
      const dateH = 24;
      const barH = 16;
      const gap = 2;
      const overflowH = 14;
      const available = rowH - dateH - overflowH - 2;
      const maxLanes = Math.max(1, Math.floor((available + gap) / (barH + gap)));
      const events = visibleEvents().slice().sort(function (a, b) {
        if (a.start !== b.start) return a.start < b.start ? -1 : 1;
        const da = daysBetween(a.start, a.end);
        const db = daysBetween(b.start, b.end);
        if (da !== db) return db - da;
        return (a.title || "").localeCompare(b.title || "", "en");
      });

      weeks.forEach(function (weekEl) {
        const dayCells = weekEl.querySelectorAll(".day-cell");
        const weekStart = dayCells[0].getAttribute("data-date");
        const weekEnd = dayCells[6].getAttribute("data-date");
        const weekEvents = events.filter(function (e) {
          return e.start <= weekEnd && e.end >= weekStart;
        });
        const occupied = [];
        const placed = [];
        weekEvents.forEach(function (ev) {
          const startDay = Math.max(0, daysBetween(weekStart, ev.start));
          const endDay = Math.min(6, daysBetween(weekStart, ev.end));
          let lane = 0;
          for (;;) {
            if (!occupied[lane]) occupied[lane] = [0, 0, 0, 0, 0, 0, 0];
            let ok = true;
            for (let d = startDay; d <= endDay; d++) {
              if (occupied[lane][d]) { ok = false; break; }
            }
            if (ok) {
              for (let d = startDay; d <= endDay; d++) occupied[lane][d] = 1;
              placed.push({
                ev: ev,
                lane: lane,
                startDay: startDay,
                endDay: endDay,
                startsThisWeek: ev.start >= weekStart,
                endsThisWeek: ev.end <= weekEnd
              });
              break;
            }
            lane++;
          }
        });

        const overflowCount = [0, 0, 0, 0, 0, 0, 0];
        const layer = weekEl.querySelector(".week-events");
        let bars = "";
        placed.forEach(function (p) {
          if (p.lane >= maxLanes) {
            for (let d = p.startDay; d <= p.endDay; d++) overflowCount[d]++;
            return;
          }
          const co = companyById(p.ev.companyId);
          const color = co ? co.color : "#8E8E93";
          const insetL = p.startsThisWeek ? 2 : 0;
          const insetR = p.endsThisWeek ? 2 : 0;
          const left = "calc(" + ((p.startDay / 7) * 100) + "% + " + insetL + "px)";
          const width = "calc(" + (((p.endDay - p.startDay + 1) / 7) * 100) + "% - " + (insetL + insetR) + "px)";
          const top = dateH + p.lane * (barH + gap);
          const radiusL = p.startsThisWeek ? "3px" : "0";
          const radiusR = p.endsThisWeek ? "3px" : "0";
          const title = p.ev.title;
          bars += '<div class="event-bar" data-id="' + escapeHtml(p.ev.id) + '" style="' +
            "left:" + left + ";width:" + width + ";top:" + top + "px;" +
            "background:" + color + ";color:" + textColor(color) + ";" +
            "border-radius:" + radiusL + " " + radiusR + " " + radiusR + " " + radiusL +
            ';" title="' + escapeHtml(p.ev.title) + '">' + escapeHtml(title) + "</div>";
        });
        layer.innerHTML = bars;

        dayCells.forEach(function (cell, i) {
          const ov = cell.querySelector(".day-overflow");
          if (overflowCount[i] > 0) ov.textContent = "+" + overflowCount[i];
          else ov.textContent = "";
        });
      });
    }

    function renderLegend() {
      if (!data.companies.length) {
        el.legend.innerHTML = '<span class="empty" style="padding:0">Add a company first</span>';
        return;
      }
      el.legend.innerHTML = data.companies.map(function (c) {
        const off = data.hiddenCompanyIds.indexOf(c.id) !== -1;
        return '<button type="button" class="legend-chip' + (off ? " off" : "") + '" data-company="' +
          escapeHtml(c.id) + '"><span class="dot" style="background:' + escapeHtml(c.color) +
          '"></span>' + escapeHtml(c.name) + "</button>";
      }).join("");
    }

    /* ------------ navigation ------------ */
    function prevMonth() {
      const first = new Date(viewYear, viewMonth - 1, 1);
      viewYear = first.getFullYear();
      viewMonth = first.getMonth();
      el.monthLabel.textContent = MONTHS[viewMonth] + " " + viewYear;
      updateOutsideClasses();
      scrollToWeek(weekStartISO(first), false);
    }
    function nextMonth() {
      const first = new Date(viewYear, viewMonth + 1, 1);
      viewYear = first.getFullYear();
      viewMonth = first.getMonth();
      el.monthLabel.textContent = MONTHS[viewMonth] + " " + viewYear;
      updateOutsideClasses();
      scrollToWeek(weekStartISO(first), false);
    }
    function goToday() {
      selectedDate = todayISO();
      updateSelected();
      scrollToWeek(weekStartISO(new Date()), true);
    }

    /* ------------ sheets ------------ */
    function openSheet(html) {
      el.sheet.innerHTML = html;
      el.sheet.scrollTop = 0;
      el.backdrop.classList.add("show");
      el.sheet.classList.add("show");
      sheetOpen = true;
    }
    function closeSheet() {
      el.backdrop.classList.remove("show");
      el.sheet.classList.remove("show");
      sheetOpen = false;
    }

    function openDayList(iso) {
      selectedDate = iso;
      updateSelected();
      const hidden = {};
      data.hiddenCompanyIds.forEach(function (id) { hidden[id] = true; });
      const list = data.events
        .filter(function (e) { return e.start <= iso && e.end >= iso && !hidden[e.companyId]; })
        .sort(function (a, b) {
          if (a.start !== b.start) return a.start < b.start ? -1 : 1;
          return (a.title || "").localeCompare(b.title || "", "en");
        });
      let items = "";
      if (!list.length) {
        items = '<div class="empty">No jobs on this day</div>';
      } else {
        items = '<div class="group">' + list.map(function (e) {
          const co = companyById(e.companyId);
          const color = co ? co.color : "#8E8E93";
          const range = e.start === e.end ? "" : formatShort(e.start) + " – " + formatShort(e.end);
          const meta = [co ? co.name : "No company", range, e.note].filter(Boolean).join(" · ");
          return '<button type="button" class="event-item" data-edit-event="' + escapeHtml(e.id) + '">' +
            '<span class="stripe" style="background:' + escapeHtml(color) + '"></span>' +
            '<span class="body"><div class="title">' + escapeHtml(e.title) + "</div>" +
            '<div class="meta">' + escapeHtml(meta) + "</div></span></button>";
        }).join("") + "</div>";
      }
      openSheet(
        '<div class="sheet-handle"></div>' +
        '<div class="sheet-head">' +
          '<button type="button" class="side" data-close>Close</button>' +
          "<h2>" + formatLong(iso) + "</h2>" +
          '<span class="side right"></span>' +
        "</div>" +
        items +
        '<button type="button" class="link-btn" data-add-on="' + iso + '">Add job</button>'
      );
    }

    function openEventForm(opts) {
      opts = opts || {};
      const ev = opts.event || null;
      const start = ev ? ev.start : (opts.date || todayISO());
      const end = ev ? ev.end : start;
      const title = ev ? ev.title : "";
      const note = ev ? (ev.note || "") : "";
      const companyId = ev ? ev.companyId : (data.companies[0] ? data.companies[0].id : "");
      if (!data.companies.length) {
        toast("Add a company in the menu first");
        openCompanyManager();
        return;
      }
      const companyOptions = data.companies.map(function (c) {
        const sel = c.id === companyId ? " selected" : "";
        return '<option value="' + escapeHtml(c.id) + '"' + sel + ">" + escapeHtml(c.name) + "</option>";
      }).join("");
      const delBtn = ev ? '<button type="button" class="link-btn danger" data-delete-event="' + escapeHtml(ev.id) + '">Delete job</button>' : "";
      openSheet(
        '<div class="sheet-handle"></div>' +
        '<div class="sheet-head">' +
          '<button type="button" class="side" data-close>Cancel</button>' +
          "<h2>" + (ev ? "Edit job" : "Add job") + "</h2>" +
          '<button type="button" class="side right" id="btn-save-event">Save</button>' +
        "</div>" +
        '<div class="group">' +
          '<label class="row"><span class="label">Title</span>' +
            '<input type="text" id="f-title" maxlength="80" placeholder="e.g. Van-2400, Danny off" value="' + escapeHtml(title) + '">' +
          "</label>" +
          '<label class="row"><span class="label">Company</span>' +
            '<select id="f-company" style="flex:1;border:0;background:transparent;font-size:16px;height:32px;min-width:0">' +
              companyOptions +
            "</select>" +
          "</label>" +
          '<label class="row"><span class="label">Start</span>' +
            '<input type="date" id="f-start" value="' + start + '">' +
          "</label>" +
          '<label class="row"><span class="label">End</span>' +
            '<input type="date" id="f-end" value="' + end + '">' +
          "</label>" +
          '<label class="row" style="align-items:flex-start"><span class="label" style="padding-top:10px">Note / address</span>' +
            '<textarea id="f-note" maxlength="400" placeholder="Optional">' + escapeHtml(note) + "</textarea>" +
          "</label>" +
        "</div>" +
        delBtn
      );
      const titleInput = document.getElementById("f-title");
      const startInput = document.getElementById("f-start");
      const endInput = document.getElementById("f-end");
      startInput.addEventListener("change", function () {
        if (endInput.value && endInput.value < startInput.value) endInput.value = startInput.value;
      });
      document.getElementById("btn-save-event").addEventListener("click", function () {
        const t = titleInput.value.trim();
        if (!t) { toast("Please enter a title"); titleInput.focus(); return; }
        const s = startInput.value;
        let en = endInput.value || s;
        if (!isISODate(s)) { toast("Please choose a start date"); return; }
        if (!isISODate(en)) { toast("Please choose an end date"); return; }
        if (en < s) en = s;
        const cid = document.getElementById("f-company").value;
        if (!companyById(cid)) { toast("Please choose a company"); return; }
        const noteVal = document.getElementById("f-note").value.trim();
        if (ev) {
          ev.title = t;
          ev.companyId = cid;
          ev.start = s;
          ev.end = en;
          ev.note = noteVal;
        } else {
          data.events.push({
            id: uid("e-"),
            title: t,
            companyId: cid,
            start: s,
            end: en,
            note: noteVal
          });
        }
        saveData();
        selectedDate = s;
        const sd = parseISODate(s);
        closeSheet();
        layoutEventBars();
        updateSelected();
        scrollToWeek(weekStartISO(sd), true);
      });
      setTimeout(function () { titleInput.focus(); }, 320);
    }

    function openSettings() {
      openSheet(
        '<div class="sheet-handle"></div>' +
        '<div class="sheet-head">' +
          '<button type="button" class="side" data-close>Close</button>' +
          "<h2>Menu</h2>" +
          '<span class="side right"></span>' +
        "</div>" +
        '<div class="group">' +
          '<button type="button" class="row-btn" id="btn-companies"><span class="dot" style="background:#E67E22"></span>Companies<span class="chev">›</span></button>' +
          '<button type="button" class="row-btn" id="btn-filter"><span class="dot" style="background:#2F80ED"></span>Filter by company<span class="chev">›</span></button>' +
        "</div>" +
        '<div class="group">' +
          '<button type="button" class="row-btn" id="btn-export">Export backup<span class="sub">JSON</span></button>' +
          '<button type="button" class="row-btn" id="btn-import">Import backup<span class="chev">›</span></button>' +
          '<button type="button" class="row-btn" id="btn-import-ikea">Import IKEA jobs<span class="chev">›</span></button>' +
        "</div>" +
        '<p class="hint">Data is stored only in this phone&#39;s browser and is never uploaded. Export a backup before switching phones or clearing Safari data. The starting companies are examples you can rename or delete.</p>' +
        '<p class="hint">To add to the Home Screen, open this page in Safari, tap Share, then choose Add to Home Screen.</p>'
      );
    }

    function openCompanyManager() {
      const list = data.companies.length
        ? '<div class="group">' + data.companies.map(function (c) {
            return '<button type="button" class="company-item" data-edit-company="' + escapeHtml(c.id) + '">' +
              '<span class="dot" style="width:16px;height:16px;flex-basis:16px;background:' + escapeHtml(c.color) + '"></span>' +
              '<span class="name">' + escapeHtml(c.name) + '</span><span class="chev">›</span></button>';
          }).join("") + "</div>"
        : '<div class="empty">No companies yet</div>';
      openSheet(
        '<div class="sheet-handle"></div>' +
        '<div class="sheet-head">' +
          '<button type="button" class="side" data-back-settings>Back</button>' +
          "<h2>Companies</h2>" +
          '<span class="side right"></span>' +
        "</div>" +
        '<p class="hint">Each colour is a company. Tap one to edit it, or delete it and add your own.</p>' +
        list +
        '<button type="button" class="link-btn" id="btn-add-company">Add company</button>'
      );
    }

    function openCompanyForm(co) {
      const name = co ? co.name : "";
      const color = co ? co.color : PRESET_COLORS[data.companies.length % PRESET_COLORS.length];
      const delBtn = co ? '<button type="button" class="link-btn danger" data-delete-company="' + escapeHtml(co.id) + '">Delete company</button>' : "";
      const swatches = PRESET_COLORS.map(function (c) {
        return '<button type="button" class="color-swatch' + (c.toLowerCase() === color.toLowerCase() ? " selected" : "") +
          '" data-color="' + c + '" style="background:' + c + '" aria-label="' + c + '"></button>';
      }).join("");
      openSheet(
        '<div class="sheet-handle"></div>' +
        '<div class="sheet-head">' +
          '<button type="button" class="side" data-back-companies>Cancel</button>' +
          "<h2>" + (co ? "Edit company" : "Add company") + "</h2>" +
          '<button type="button" class="side right" id="btn-save-company">Save</button>' +
        "</div>" +
        '<div class="group">' +
          '<label class="row"><span class="label">Name</span>' +
            '<input type="text" id="c-name" maxlength="30" placeholder="Company name" value="' + escapeHtml(name) + '">' +
          "</label>" +
          '<div class="row" style="display:block;padding:10px 16px 4px"><span class="label">Colour</span></div>' +
          '<div class="color-grid" id="color-grid">' + swatches +
            '<label class="color-custom" title="Custom colour"><input type="color" id="c-color-custom" value="' + escapeHtml(color) + '"></label>' +
          "</div>" +
          '<input type="hidden" id="c-color" value="' + escapeHtml(color) + '">' +
        "</div>" +
        delBtn
      );
      const colorInput = document.getElementById("c-color");
      document.getElementById("color-grid").addEventListener("click", function (e) {
        const sw = e.target.closest(".color-swatch");
        if (!sw) return;
        colorInput.value = sw.getAttribute("data-color");
        document.querySelectorAll(".color-swatch").forEach(function (s) { s.classList.remove("selected"); });
        sw.classList.add("selected");
      });
      document.getElementById("c-color-custom").addEventListener("input", function (e) {
        colorInput.value = e.target.value;
        document.querySelectorAll(".color-swatch").forEach(function (s) { s.classList.remove("selected"); });
      });
      document.getElementById("btn-save-company").addEventListener("click", function () {
        const n = document.getElementById("c-name").value.trim();
        if (!n) { toast("Please enter a company name"); return; }
        const col = colorInput.value || "#E67E22";
        if (co) {
          co.name = n;
          co.color = col;
        } else {
          data.companies.push({ id: uid("c-"), name: n, color: col });
        }
        saveData();
        openCompanyManager();
        renderLegend();
        layoutEventBars();
      });
      setTimeout(function () { document.getElementById("c-name").focus(); }, 320);
    }

    function openFilter() {
      const rows = data.companies.map(function (c) {
        const on = data.hiddenCompanyIds.indexOf(c.id) === -1;
        return '<button type="button" class="filter-row" data-toggle-company="' + escapeHtml(c.id) + '" style="border-bottom:1px solid var(--line)">' +
          '<span class="dot" style="width:14px;height:14px;flex-basis:14px;background:' + escapeHtml(c.color) + '"></span>' +
          '<span class="name">' + escapeHtml(c.name) + "</span>" +
          '<span class="toggle' + (on ? " on" : "") + '"></span></button>';
      }).join("");
      openSheet(
        '<div class="sheet-handle"></div>' +
        '<div class="sheet-head">' +
          '<button type="button" class="side" data-back-settings>Back</button>' +
          "<h2>Filter by company</h2>" +
          '<span class="side right"></span>' +
        "</div>" +
        '<p class="hint">Turn a company off to hide its jobs. You can also tap the colour chips at the bottom to filter.</p>' +
        '<div class="group" style="padding:0;overflow:hidden">' + (rows || '<div class="empty">No companies yet</div>') + "</div>" +
        (data.companies.length
          ? '<button type="button" class="link-btn" id="btn-show-all">Show all</button>'
          : "")
      );
    }

    function deleteEvent(id) {
      const ev = data.events.filter(function (e) { return e.id === id; })[0];
      if (!ev) return;
      confirmDialog("Delete job", "Delete \"" + ev.title + "\"?", "Delete", true, function () {
        data.events = data.events.filter(function (e) { return e.id !== id; });
        saveData();
        closeSheet();
        render();
      });
    }

    function deleteCompany(id) {
      const co = companyById(id);
      if (!co) return;
      const count = data.events.filter(function (e) { return e.companyId === id; }).length;
      const msg = count
        ? "Deleting \"" + co.name + "\" will also delete its " + count + " job(s). Continue?"
        : "Delete company \"" + co.name + "\"?";
      confirmDialog("Delete company", msg, "Delete", true, function () {
        data.companies = data.companies.filter(function (c) { return c.id !== id; });
        data.events = data.events.filter(function (e) { return e.companyId !== id; });
        data.hiddenCompanyIds = data.hiddenCompanyIds.filter(function (x) { return x !== id; });
        saveData();
        openCompanyManager();
        render();
      });
    }

    /* ------------ confirm / toast / backup ------------ */
    function confirmDialog(title, message, okLabel, danger, cb) {
      el.confirm.innerHTML = "<h3>" + escapeHtml(title) + "</h3><p>" + escapeHtml(message) + "</p>" +
        '<div class="actions"><button type="button" data-cancel-confirm>Cancel</button>' +
        '<button type="button" class="' + (danger ? "danger" : "primary") + '" data-ok-confirm>' +
        escapeHtml(okLabel) + "</button></div>";
      confirmCb = cb;
      el.confirmBackdrop.classList.add("show");
      el.confirm.classList.add("show");
    }
    function closeConfirm() {
      el.confirmBackdrop.classList.remove("show");
      el.confirm.classList.remove("show");
      confirmCb = null;
    }
    function toast(msg) {
      el.toast.textContent = msg;
      el.toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { el.toast.classList.remove("show"); }, 2400);
    }

    function exportBackup() {
      const payload = {
        app: "gongli",
        version: 1,
        exportedAt: new Date().toISOString(),
        companies: data.companies,
        events: data.events,
        hiddenCompanyIds: data.hiddenCompanyIds
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "job-calendar-backup-" + todayISO() + ".json";
      document.body.appendChild(a);
      a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
      toast("Backup exported");
    }

    function importBackupFile(file) {
      const reader = new FileReader();
      reader.onload = function () {
        try {
          const parsed = JSON.parse(reader.result);
          const companies = Array.isArray(parsed.companies) ? parsed.companies.filter(validCompany) : [];
          const events = Array.isArray(parsed.events) ? parsed.events.filter(validEvent) : [];
          if (!companies.length && !events.length && !Array.isArray(parsed.companies)) {
            toast("Invalid backup file");
            return;
          }
          confirmDialog(
            "Import backup",
            "Importing will replace all current companies and jobs. Continue?",
            "Import",
            false,
            function () {
              data.companies = companies.length ? companies : data.companies;
              data.events = events;
              data.hiddenCompanyIds = Array.isArray(parsed.hiddenCompanyIds) ? parsed.hiddenCompanyIds : [];
              saveData();
              closeSheet();
              render();
              toast("Import complete");
            }
          );
        } catch (err) {
          toast("Could not read the file");
        }
      };
      reader.readAsText(file, "utf-8");
    }


    function ensureIkeaCompany() {
      var i, co = null;
      for (i = 0; i < data.companies.length; i++) {
        if ((data.companies[i].name || "").toLowerCase().indexOf("ikea") !== -1) {
          co = data.companies[i];
          break;
        }
      }
      if (co) return co;
      var taken = {};
      data.companies.forEach(function (c) { taken[c.id] = true; });
      co = { id: taken["c-ikea"] ? uid("c-") : "c-ikea", name: "IKEA", color: "#E67E22" };
      data.companies.push(co);
      return co;
    }

    function applyIkeaImport(jobs) {
      var company = ensureIkeaCompany();
      var added = 0, updated = 0, removed = 0;
      jobs.forEach(function (j) {
        if (!j || typeof j.ikeaKey !== "string") return;
        var key = j.ikeaKey.trim();
        if (!key) return;
        var existing = data.events.filter(function (e) { return e.ikeaKey === key; })[0];
        if (j.removed) {
          if (existing) {
            data.events = data.events.filter(function (e) { return e.ikeaKey !== key; });
            removed += 1;
          }
          return;
        }
        var title = (typeof j.title === "string" ? j.title : "").trim().slice(0, 80);
        var start = j.start;
        var end = j.end;
        if (!title || !isISODate(start) || !isISODate(end)) return;
        var s = start <= end ? start : end;
        var en = start <= end ? end : start;
        var note = (typeof j.note === "string" ? j.note : "").trim().slice(0, 400);
        if (existing) {
          existing.title = title;
          existing.start = s;
          existing.end = en;
          var edited = typeof existing.ikeaNote === "string" ? existing.note !== existing.ikeaNote : (existing.note || "") !== "" && existing.note !== note;
          if (!edited) existing.note = note;
          existing.ikeaNote = edited ? existing.ikeaNote : note;
          existing.companyId = company.id;
          updated += 1;
        } else {
          data.events.push({
            id: uid("e-"),
            title: title,
            companyId: company.id,
            start: s,
            end: en,
            note: note,
            ikeaNote: note,
            ikeaKey: key
          });
          added += 1;
        }
      });
      saveData();
      closeSheet();
      render();
      toast("Imported " + added + " new, updated " + updated + ", removed " + removed);
    }

    function importIkeaJobsFile(file) {
      var reader = new FileReader();
      reader.onload = function () {
        try {
          var parsed = JSON.parse(reader.result);
          var jobs = parsed && Array.isArray(parsed.jobs) ? parsed.jobs : null;
          if (!parsed || parsed.type !== "ikea-jobs" || !jobs) {
            toast("This is not an IKEA jobs file");
            return;
          }
          confirmDialog(
            "Import IKEA jobs",
            "Add or update IKEA jobs from this file. Other jobs will not be changed.",
            "Import",
            false,
            function () {
              applyIkeaImport(jobs);
            }
          );
        } catch (err) {
          toast("Could not read the file");
        }
      };
      reader.readAsText(file, "utf-8");
    }

    /* ------------ events binding ------------ */
    document.getElementById("dow").innerHTML = WEEKDAYS.map(function (w, i) {
      return '<span class="' + (i === 0 ? "sun" : "") + '">' + w + "</span>";
    }).join("");

    document.getElementById("btn-prev").addEventListener("click", prevMonth);
    document.getElementById("btn-next").addEventListener("click", nextMonth);
    el.btnToday.addEventListener("click", goToday);
    document.getElementById("btn-menu").addEventListener("click", openSettings);
    el.fab.addEventListener("click", function () {
      const date = selectedDate && isSameMonth(selectedDate, viewYear, viewMonth) ? selectedDate : (
        isSameMonth(todayISO(), viewYear, viewMonth) ? todayISO() : toISODate(new Date(viewYear, viewMonth, 1))
      );
      openEventForm({ date: date });
    });

    el.calendar.addEventListener("click", function (e) {
      const bar = e.target.closest(".event-bar");
      if (bar) {
        const ev = data.events.filter(function (x) { return x.id === bar.getAttribute("data-id"); })[0];
        if (ev) openEventForm({ event: ev });
        return;
      }
      const cell = e.target.closest(".day-cell");
      if (cell) openDayList(cell.getAttribute("data-date"));
    });

    el.legend.addEventListener("click", function (e) {
      const chip = e.target.closest(".legend-chip");
      if (!chip) return;
      const id = chip.getAttribute("data-company");
      const i = data.hiddenCompanyIds.indexOf(id);
      if (i === -1) data.hiddenCompanyIds.push(id);
      else data.hiddenCompanyIds.splice(i, 1);
      saveData();
      render();
    });

    el.backdrop.addEventListener("click", closeSheet);
    el.confirmBackdrop.addEventListener("click", closeConfirm);

    el.sheet.addEventListener("click", function (e) {
      if (e.target.closest("[data-close]")) { closeSheet(); return; }
      if (e.target.closest("[data-back-settings]")) { openSettings(); return; }
      if (e.target.closest("[data-back-companies]")) { openCompanyManager(); return; }
      const addOn = e.target.closest("[data-add-on]");
      if (addOn) { openEventForm({ date: addOn.getAttribute("data-add-on") }); return; }
      const editEv = e.target.closest("[data-edit-event]");
      if (editEv) {
        const ev = data.events.filter(function (x) { return x.id === editEv.getAttribute("data-edit-event"); })[0];
        if (ev) openEventForm({ event: ev });
        return;
      }
      const delEv = e.target.closest("[data-delete-event]");
      if (delEv) { deleteEvent(delEv.getAttribute("data-delete-event")); return; }
      if (e.target.closest("#btn-companies")) { openCompanyManager(); return; }
      if (e.target.closest("#btn-filter")) { openFilter(); return; }
      if (e.target.closest("#btn-export")) { exportBackup(); return; }
      if (e.target.closest("#btn-import")) { el.importFile.click(); return; }
      if (e.target.closest("#btn-import-ikea")) { el.ikeaImportFile.click(); return; }
      if (e.target.closest("#btn-add-company")) { openCompanyForm(null); return; }
      const editCo = e.target.closest("[data-edit-company]");
      if (editCo) {
        openCompanyForm(companyById(editCo.getAttribute("data-edit-company")));
        return;
      }
      const delCo = e.target.closest("[data-delete-company]");
      if (delCo) { deleteCompany(delCo.getAttribute("data-delete-company")); return; }
      const tog = e.target.closest("[data-toggle-company]");
      if (tog) {
        const id = tog.getAttribute("data-toggle-company");
        const i = data.hiddenCompanyIds.indexOf(id);
        if (i === -1) data.hiddenCompanyIds.push(id);
        else data.hiddenCompanyIds.splice(i, 1);
        saveData();
        render();
        openFilter();
        return;
      }
      if (e.target.closest("#btn-show-all")) {
        data.hiddenCompanyIds = [];
        saveData();
        render();
        openFilter();
      }
    });

    el.confirm.addEventListener("click", function (e) {
      if (e.target.closest("[data-cancel-confirm]")) { closeConfirm(); return; }
      if (e.target.closest("[data-ok-confirm]")) {
        const cb = confirmCb;
        closeConfirm();
        if (cb) cb();
      }
    });

    el.importFile.addEventListener("change", function () {
      const file = el.importFile.files && el.importFile.files[0];
      el.importFile.value = "";
      if (file) importBackupFile(file);
    });
    el.ikeaImportFile.addEventListener("change", function () {
      const file = el.ikeaImportFile.files && el.ikeaImportFile.files[0];
      el.ikeaImportFile.value = "";
      if (file) importIkeaJobsFile(file);
    });

    el.calendar.addEventListener("scroll", function () {
      if (titleRaf) return;
      titleRaf = requestAnimationFrame(function () {
        titleRaf = 0;
        updateMonthTitle();
        maybeExtendRange();
      });
    }, { passive: true });

    window.addEventListener("resize", function () {
      layoutEventBars();
      updateMonthTitle();
    });

    /* install tip */
    const isStandalone = window.navigator.standalone === true ||
      window.matchMedia("(display-mode: standalone)").matches;
    if (!isStandalone && !localStorage.getItem(TIP_KEY)) {
      el.installTip.classList.add("show");
    }
    document.getElementById("btn-close-tip").addEventListener("click", function () {
      el.installTip.classList.remove("show");
      localStorage.setItem(TIP_KEY, "1");
      layoutEventBars();
    });

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js").catch(function () {});
    }

    render();
  })();
  </script>
</body>
</html>
